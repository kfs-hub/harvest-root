<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Root — Support Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <style>
        :root {
            --primary: #0288d1;
            --accent: #0288d1;
        }
        .sidebar-brand div span {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="images/harvest root logo.png" alt="Logo">
            <div>
                <h1>Harvest Root</h1>
                <span>Support Portal</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Management</div>
            <button class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Messages
                <span class="nav-badge" id="contacts-count-badge" style="background: var(--primary);">0</span>
            </button>
        </nav>
        <div class="sidebar-footer">
            <a href="/">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                View Store
            </a>
            <button class="btn-logout" id="btn-change-pw" style="margin-top:0.5rem; background:transparent; border:1px solid rgba(255,255,255,0.12); color:var(--text-light);" onclick="document.getElementById('change-pw-modal').classList.add('active')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Change Password
            </button>
            <button class="btn-logout" id="btn-logout" onclick="handleLogout()" style="margin-top:0.5rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </button>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main Content -->
    <div class="main">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <h1 class="topbar-title" id="topbar-title">Messages</h1>
            </div>
            <div class="topbar-actions">
                <div class="admin-user-badge" id="admin-user-badge" style="border-color: rgba(2, 136, 209, 0.3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span id="admin-username-display">Support Exec</span>
                </div>
                <button class="btn-refresh" id="btn-refresh" onclick="refreshData()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    Refresh
                </button>
            </div>
        </header>

        <div class="content">
            <!-- Stats -->
            <div class="stats-grid" id="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div class="stat-icon red" style="background: rgba(2, 136, 209, 0.1); color: #0288d1;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </div>
                        <span class="stat-label">Total Messages</span>
                    </div>
                    <div class="stat-value" id="stat-messages">0</div>
                    <div class="stat-sub">Customer inquiries</div>
                </div>
            </div>

            <!-- Contacts Panel -->
            <div class="tab-panel active" id="contacts-panel">
                <div class="section-panel">
                    <div class="section-header">
                        <h2>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            Contact Messages
                        </h2>
                    </div>
                    <div class="section-body">
                        <div class="contacts-list" id="contacts-list">
                            <div class="empty-state"><p>Loading messages...</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="edit-modal-overlay" id="change-pw-modal">
        <div class="edit-modal-card" style="max-width:420px;">
            <div class="edit-modal-header">
                <h2>Change Password</h2>
                <button class="btn-close-modal" onclick="document.getElementById('change-pw-modal').classList.remove('active')" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="edit-modal-body">
                <form id="change-pw-form" class="admin-form">
                    <div class="form-group">
                        <label for="cp-current">Current Password</label>
                        <input type="password" id="cp-current" required placeholder="Enter current password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="cp-new">New Password</label>
                        <input type="password" id="cp-new" required placeholder="Min 6 characters" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="cp-confirm">Confirm New Password</label>
                        <input type="password" id="cp-confirm" required placeholder="Re-enter new password" minlength="6">
                    </div>
                    <div class="edit-modal-footer">
                        <button type="button" class="btn-cancel-modal" onclick="document.getElementById('change-pw-modal').classList.remove('active')">Cancel</button>
                        <button type="submit" class="btn-submit-form" style="margin-top:0;">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="support.js"></script>
    <script>
    document.getElementById('change-pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('cp-current').value;
        const newPassword = document.getElementById('cp-new').value;
        const confirmPassword = document.getElementById('cp-confirm').value;
        if (newPassword !== confirmPassword) { alert('New passwords do not match.'); return; }
        try {
            const res = await fetch('/api/employee/request-change', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword }),
                credentials: 'include'
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message || 'Password change request submitted.');
                document.getElementById('change-pw-modal').classList.remove('active');
                document.getElementById('change-pw-form').reset();
            } else {
                alert(data.error || 'Failed to submit request.');
            }
        } catch (err) { alert('Connection error.'); }
    });
    </script>
</body>
</html>
