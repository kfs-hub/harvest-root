<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Harvest Root</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon"><img src="images/harvest root logo.png" alt="Company Logo" width="70"></span>
                <span class="logo-text">Harvest Root</span>
            </a>
            <a href="/" class="btn btn-ghost" style="padding: 0.5rem 1rem;">Back to Shop</a>
        </div>
    </nav>

    <section class="checkout-section">
        <div class="container" id="checkout-content">
            <div class="checkout-grid">
                <!-- Form -->
                <div class="checkout-form">
                    <h2>Shipping Details</h2>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Delivery Address</label>
                            <textarea id="address" name="address" rows="3" placeholder="Enter your full delivery address..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="place-order-btn">Place Order</button>
                    </form>
                </div>

                <!-- Order Summary -->
                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-items" id="summary-items">
                        <!-- Items rendered by JS -->
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="summary-total-price">₹0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="container success-msg" id="success-message">
            <h2>🎉 Order Placed!</h2>
            <p id="success-order-id"></p>
            <p>Thank you for choosing Harvest Root. We'll start processing your fresh spices right away. A confirmation email has been sent if email is configured.</p>
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </section>

    <script src="checkout.js"></script>
</body>
</html>
