<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Harvest Root</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .checkout-section { padding: 120px 0 60px; min-height: 80vh; background-color: #fcfcfc; }
        .checkout-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; max-width: 1000px; margin: 0 auto; }
        .checkout-form { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .checkout-form h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 1.5rem; color: #2c3e2f; }
        .order-summary { background: #f9f9f9; padding: 2.5rem; border-radius: 8px; border: 1px solid #eee; }
        .order-summary h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; margin-bottom: 1.5rem; color: #2c3e2f; padding-bottom: 1rem; border-bottom: 1px solid #ddd; }
        .summary-items { max-height: 400px; overflow-y: auto; margin-bottom: 1.5rem; }
        .summary-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px dashed #ddd; }
        .summary-item-info h4 { font-size: 1rem; font-weight: 500; color: #333; margin-bottom: 0.25rem; }
        .summary-item-info p { font-size: 0.85rem; color: #666; }
        .summary-item-price { font-weight: 600; color: #2c3e2f; }
        .summary-total { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 600; color: #2c3e2f; border-top: 2px solid #ddd; padding-top: 1.5rem; }
        .empty-cart-msg { text-align: center; color: #666; font-style: italic; }
        .success-msg { display: none; text-align: center; padding: 4rem 2rem; }
        .success-msg h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #2c3e2f; margin-bottom: 1rem; }
        .success-msg p { color: #555; margin-bottom: 2rem; font-size: 1.1rem; }
        @media (max-width: 768px) {
            .checkout-grid { grid-template-columns: 1fr; gap: 2rem; }
            .checkout-section { padding: 100px 0 40px; }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar scrolled">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon"><img src="images/harvest root logo.png" alt="Company Logo" width="70"></span>
                <span class="logo-text">Harvest Root</span>
            </a>
            <a href="/" class="btn btn-ghost" style="padding: 0.5rem 1rem;">Back to Shop</a>
        </div>
    </nav>

    <section class="checkout-section">
        <div class="container" id="checkout-content">
            <div class="checkout-grid">
                <!-- Form -->
                <div class="checkout-form">
                    <h2>Shipping Details</h2>
                    <form id="checkout-form">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="address">Delivery Address</label>
                            <textarea id="address" name="address" rows="3" placeholder="Enter your full delivery address..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full" id="place-order-btn">Place Order</button>
                    </form>
                </div>

                <!-- Order Summary -->
                <div class="order-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-items" id="summary-items">
                        <!-- Items rendered by JS -->
                    </div>
                    <div class="summary-total">
                        <span>Total</span>
                        <span id="summary-total-price">₹0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="container success-msg" id="success-message">
            <h2>🎉 Order Placed!</h2>
            <p>Thank you for choosing Harvest Root. We'll start processing your fresh spices right away.</p>
            <a href="/" class="btn btn-primary">Return to Home</a>
        </div>
    </section>

    <script src="checkout.js"></script>
</body>
</html>
